<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Orbit AI</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
    <symbol id="i-retry" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l2.2 6.3L21 12l-6.8 2.7L12 21l-2.2-6.3L3 12l6.8-2.7z"/></symbol>
  </defs>
</svg>

<div class="app">
  <div class="scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar" aria-label="Conversations">
    <div class="brand">
      <span class="logo"><svg class="ic"><use href="#i-spark"/></svg></span><b>Orbit</b>
      <button class="icon mobile" id="close" aria-label="Close sidebar"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <button class="new" id="new-chat"><svg class="ic"><use href="#i-plus"/></svg>New chat<kbd>Ctrl K</kbd></button>
    <div class="label"><span>Recent chats</span><button class="icon sm" id="clear" title="Clear all chats" aria-label="Clear all chats"><svg class="ic"><use href="#i-trash"/></svg></button></div>
    <div id="chat-list" class="list"></div>
    <footer>
      <button id="theme"><svg class="ic"><use id="theme-icon" href="#i-moon"/></svg><span id="theme-label">Dark mode</span></button>
      <button id="export"><svg class="ic"><use href="#i-download"/></svg>Export conversation</button>
    </footer>
  </aside>

  <main>
    <header>
      <button class="icon mobile" id="open" aria-label="Open sidebar"><svg class="ic"><use href="#i-menu"/></svg></button>
      <div class="head-title"><b id="title">New conversation</b><small id="status">Ready</small></div>
      <nav>
        <button class="icon" id="search" title="Search" aria-label="Search"><svg class="ic"><use href="#i-search"/></svg></button>
        <button class="icon" id="top" title="First message" aria-label="First message"><svg class="ic"><use href="#i-up"/></svg></button>
        <button class="icon" id="bottom" title="Latest message" aria-label="Latest message"><svg class="ic"><use href="#i-down"/></svg></button>
      </nav>
    </header>
    <div id="search-box" class="search hidden">
      <svg class="ic"><use href="#i-search"/></svg>
      <input id="find" placeholder="Search this conversation" aria-label="Search this conversation">
      <span id="count"></span>
    </div>
    <section id="messages" class="messages" aria-live="polite"></section>
    <form id="composer">
      <div id="preview" class="preview hidden"></div>
      <div class="input">
        <label class="icon" title="Attach image"><svg class="ic"><use href="#i-image"/></svg><input id="image" type="file" accept="image/*"></label>
        <textarea id="prompt" rows="1" placeholder="Message Orbit" autofocus></textarea>
        <button class="send" aria-label="Send"><svg class="ic"><use href="#i-send"/></svg></button>
      </div>
      <p>Enter to send. Shift + Enter for a new line.</p>
    </form>
  </main>
</div>

<template id="message">
  <article class="message">
    <span class="avatar"></span>
    <div class="bubble">
      <div class="content"></div>
      <div class="actions">
        <button class="copy"><svg class="ic"><use href="#i-copy"/></svg><span>Copy</span></button>
        <button class="retry hidden"><svg class="ic"><use href="#i-retry"/></svg><span>Retry</span></button>
      </div>
    </div>
  </article>
</template>
<script src="app.js"></script>
</body>
</html>
