<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit AI</title><link rel="stylesheet" href="styles.css"></head><body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><b>✦ Orbit</b><button class="mobile" id="close">×</button></div><button class="new" id="new-chat">＋ New chat <kbd>Ctrl K</kbd></button><div class="label">RECENT CHATS <button id="clear">⌫</button></div><div id="chat-list" class="list"></div><footer><button id="theme">◐ Appearance</button><button id="export">⇩ Export conversation</button></footer></aside><main><header><button class="mobile" id="open">☰</button><div><b id="title">New conversation</b><small id="status">Ready to help</small></div><nav><button id="search">⌕</button><button id="top" title="Go to first message">⇡</button><button id="bottom" title="Go to latest message">⇣</button></nav></header><div id="search-box" class="search hidden"><input id="find" placeholder="Search this conversation…"><span id="count"></span></div><section id="messages" class="messages"></section><div class="jump"><button id="jump-top">⇡</button><button id="jump-bottom">⇣</button></div><form id="composer"><div id="preview" class="preview hidden"></div><div class="input"><label title="Add image">▧<input id="image" type="file" accept="image/*"></label><textarea id="prompt" rows="1" placeholder="Message Orbit…" autofocus></textarea><button class="send">↑</button></div><p>Enter to send · Shift + Enter for a new line · Images are supported</p></form></main></div><template id="message"><article class="message"><i></i><div class="bubble"><div class="content"></div><div class="actions"><button class="copy">Copy</button><button class="retry hidden">Retry</button></div></div></article></template><script src="app.js"></script></body></html>
